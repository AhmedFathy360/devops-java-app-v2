name: CI — Build, Scan & Publish

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Maven Build
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and Test
        run: mvn -B clean package

      - name: Generate image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
      
  docker-scan:
      name: Docker Build & Trivy Scan
      runs-on: self-hosted
      needs: build 
    
      steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar      
          path: target/

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false        # local only, no push yet
          load: true         # load into local Docker daemon so Trivy can scan it
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-java-app-v2:${{ needs.build.outputs.image_tag }}

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devops-java-app-v2:${{ needs.build.outputs.image_tag }}
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      
  push:
    name: Push to Docker Hub
    runs-on: self-hosted
    needs: [build, docker-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-java-app-v2:${{ needs.build.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-java-app-v2:latest
  
  update-helm:
    name: Update Helm Chart Tag
    runs-on: self-hosted
    needs: push

    steps:
      - name: Checkout Helm repo
        uses: actions/checkout@v4
        with:
          repository: AhmedFathy360/devops-java-helm-v2
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: helm-repo

      - name: Update image tag
        run: |
          cd helm-repo
          sed -i "s|tag:.*|tag: \"${{ needs.build.outputs.image_tag }}\"|" values.yaml

      - name: Commit and push
        run: |
          cd helm-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git commit -m "chore: bump image tag to ${{ needs.build.outputs.image_tag }} [skip ci]"
          git push