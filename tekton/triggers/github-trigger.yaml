apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
  namespace: tekton-pipelines
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)
    - name: image-tag
      value: $(extensions.truncated_sha)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: java-app-trigger-template
  namespace: tekton-pipelines
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: image-tag

  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: java-app-pipeline-run-
        namespace: tekton-pipelines
      spec:
        pipelineRef:
          name: java-app-pipeline
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: image-tag
            value: $(tt.params.image-tag)
          - name: image
            value: "perdita997/devops-java-app-v2"
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ ReadWriteOnce ]
                resources:
                  requests:
                    storage: 1Gi

          - name: helm-source
            volumeClaimTemplate:
              spec:
                accessModes: [ ReadWriteOnce ]
                resources:
                  requests:
                    storage: 512Mi

          - name: maven-cache
            persistentVolumeClaim:
              claimName: maven-cache-pvc

          - name: dockerconfig
            secret:
              secretName: dockerhub-credentials

          - name: git-credentials
            secret:
              secretName: git-credentials
---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: github-push-trigger
  namespace: tekton-pipelines
spec:
  interceptors:
    - ref:
        name: github
        kind: ClusterInterceptor
      params:
        - name: secretRef
          value:
            secretName: github-webhook-secret
            secretKey: secret
        - name: eventTypes
          value: [ push ]
    - ref:
        name: cel
        kind: ClusterInterceptor
      params:
        - name: filter
          value: "body.ref == 'refs/heads/main'"
        - name: overlays
          value:
            - key: truncated_sha
              expression: "body.after.truncate(7)"

  bindings:
    - ref: github-push-binding

  template:
    ref: java-app-trigger-template
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: github-push-listener
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-triggers-sa
  triggers:
    - triggerRef: github-push-trigger